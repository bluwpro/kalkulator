<html>
  <head>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
    <input type="text" class="display">
    <div class="buttons">
      <button class="operator" data_value="AC">AC</button>
      <button class="operator" data_value="DEL">DEL</button>
      <button class="operator" data_value="%">%</button>
      <button class="operator" data_value="/">/</button>
      <button data_value="7">7</button>
      <button data_value="8">8</button>
      <button data_value="9">9</button>
      <button class="operator" data_value=""></button>
      <button data_value="4">4</button>
      <button data_value="5">5</button>
      <button data_value="6">6</button>
      <button class="operator" data_value="-">-</button>
      <button data_value="1">1</button>
      <button data_value="2">2</button>
      <button data_value="3">3</button>
      <button class="operator" data_value="+">+</button>
      <button data_value="0">0</button>
      <button data_value="00">00</button>
      <button class="operator" data_value=".">.</button>
      <button class="operator" data_value="=">=</button>
    </div>
    </div>
  </body>
</html>
